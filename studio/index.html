<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ HyperAgent Studio</title>
  <style>
    /* ── Reset & Variables ───────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --surface2: #1c2128;
      --border:   #30363d;
      --text:     #e6edf3;
      --dim:      #8b949e;
      --faint:    #484f58;
      --accent:   #58a6ff;
      --green:    #3fb950;
      --green-bg: #0d2618;
      --red:      #f85149;
      --red-bg:   #2d1118;
      --yellow:   #d29922;
      --purple:   #bc8cff;
      --orange:   #f0883e;
      --gold:     #e3b341;
      --h-hdr:    52px;
      --h-ftr:    36px;
      --w-side:   196px;
      --w-detail: 336px;
    }
    html, body {
      height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px; line-height: 1.5;
    }
    button { cursor: pointer; border: none; background: none; font: inherit; color: inherit; }
    code {
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      background: var(--surface2); padding: 1px 5px;
      border-radius: 3px; font-size: 11px;
    }
    ::placeholder { color: var(--faint); }

    /* ── Layout shells ───────────────────────────────────────── */
    #hdr {
      position: fixed; top: 0; left: 0; right: 0; height: var(--h-hdr);
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; padding: 0 14px; z-index: 100;
    }
    #layout {
      position: fixed; top: var(--h-hdr); bottom: var(--h-ftr);
      left: 0; right: 0; display: flex;
    }
    #sidebar {
      width: var(--w-side); min-width: var(--w-side);
      background: var(--surface); border-right: 1px solid var(--border);
      overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 14px;
    }
    #main { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    #detail {
      width: var(--w-detail); min-width: var(--w-detail);
      background: var(--surface); border-left: 1px solid var(--border);
      overflow-y: auto;
    }
    #ftr {
      position: fixed; bottom: 0; left: 0; right: 0; height: var(--h-ftr);
      background: var(--surface2); border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; padding: 0 14px; font-size: 11px;
    }

    /* ── Header ──────────────────────────────────────────────── */
    .logo { font-weight: 700; font-size: 15px; color: var(--accent); white-space: nowrap; }
    .logo em { font-style: normal; color: var(--dim); font-weight: 400; font-size: 11px; margin-left: 6px; }
    #search {
      flex: 1; max-width: 300px; height: 30px; padding: 0 10px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font: inherit; outline: none;
      transition: border-color .15s;
    }
    #search:focus { border-color: var(--accent); }
    .hdr-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    #stats { color: var(--dim); font-size: 12px; white-space: nowrap; }

    /* ── Buttons ─────────────────────────────────────────────── */
    .btn {
      height: 28px; padding: 0 10px; border-radius: 6px; font-size: 12px;
      border: 1px solid var(--border); background: var(--surface2); color: var(--text);
      transition: border-color .12s, color .12s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-green { border-color: var(--green); background: var(--green-bg); color: var(--green); }
    .btn-green:hover { opacity: .85; color: var(--green); }

    /* ── Sidebar filters ─────────────────────────────────────── */
    .f-title {
      font-size: 10px; font-weight: 700; color: var(--dim);
      text-transform: uppercase; letter-spacing: .6px; margin-bottom: 5px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip {
      display: inline-flex; align-items: center; gap: 3px;
      height: 22px; padding: 0 8px; border-radius: 11px; font-size: 11px;
      border: 1px solid var(--border); background: var(--surface2);
      cursor: pointer; color: var(--dim); white-space: nowrap; transition: all .12s;
    }
    .chip:hover  { border-color: var(--accent); color: var(--accent); }
    .chip.on     { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
    .chip-node   { border-color: #3fb95055; color: var(--green); }
    .chip-python { border-color: #58a6ff55; color: var(--accent); }
    .chip-deno   { border-color: #bc8cff55; color: var(--purple); }
    .fsel {
      width: 100%; height: 28px; padding: 0 8px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font: inherit; outline: none;
    }
    .fsel:focus { border-color: var(--accent); }
    #btn-clear-f { font-size: 11px; color: var(--faint); padding: 2px 0; }
    #btn-clear-f:hover { color: var(--red); }

    /* ── Cards grid ──────────────────────────────────────────── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px; align-content: start;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px; cursor: pointer;
      display: flex; flex-direction: column; gap: 7px;
      transition: border-color .12s, transform .1s; user-select: none;
    }
    .card:hover      { border-color: var(--accent); transform: translateY(-1px); }
    .card.sel        { border-color: var(--accent); background: #0d1f3c; }
    .card.clustered  { border-color: var(--green); }
    .card.drag-hover { border-color: var(--purple); border-style: dashed; }
    .card-top  { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
    .card-name { font-weight: 600; font-size: 13px; line-height: 1.3; }
    .card-sub  { font-size: 10px; color: var(--dim); margin-top: 2px; }
    .card-desc {
      font-size: 11px; color: var(--dim); line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-meta  { display: flex; flex-wrap: wrap; gap: 4px; }
    .card-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 1px; }
    .cp { display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 7px; border-radius: 10px; font-size: 11px; border: 1px solid; }
    .cp-node   { background: #0d2618; border-color: #3fb95055; color: var(--green); }
    .cp-python { background: #031d3d; border-color: #58a6ff55; color: var(--accent); }
    .cp-deno   { background: #1f0d3a; border-color: #bc8cff55; color: var(--purple); }
    .cp-mcp    { background: #031d3d; border-color: var(--accent); color: var(--accent); }
    .cp-mem    { background: #1f0d3a; border-color: var(--purple); color: var(--purple); }
    .cp-dim    { background: var(--surface2); border-color: var(--faint); color: var(--dim); }
    .badge { display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 10px; font-weight: 500; }

    /* ── Cluster button on card ──────────────────────────────── */
    .btn-c {
      flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--dim); font-size: 15px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      transition: all .12s;
    }
    .btn-c:hover      { border-color: var(--green); color: var(--green); }
    .btn-c.on         { background: var(--green-bg); border-color: var(--green); color: var(--green); font-size: 11px; font-weight: 700; }

    /* ── Empty state ─────────────────────────────────────────── */
    #empty { display: none; text-align: center; padding: 60px 20px; color: var(--dim); }
    #empty .icon { font-size: 36px; margin-bottom: 10px; }

    /* ── Cluster panel ───────────────────────────────────────── */
    #cluster-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden;
    }
    #cluster-hdr {
      display: flex; align-items: center; gap: 8px; padding: 9px 12px;
      border-bottom: 1px solid transparent; cursor: pointer;
      transition: background .12s;
    }
    #cluster-hdr:hover { background: var(--surface2); }
    #cluster-hdr.open  { border-bottom-color: var(--border); }
    .cl-title { font-weight: 600; font-size: 13px; }
    .cl-count {
      background: var(--surface2); color: var(--dim);
      border-radius: 10px; padding: 1px 7px; font-size: 11px; font-weight: 700;
    }
    .cl-count.has { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
    #cl-arrow { margin-left: auto; color: var(--dim); font-size: 16px; transition: transform .2s; }
    #cl-arrow.open { transform: rotate(90deg); }

    #cluster-body { display: none; padding: 12px; flex-direction: column; gap: 10px; }
    #cluster-body.open { display: flex; }

    #cl-drop {
      border: 2px dashed var(--border); border-radius: 6px;
      min-height: 44px; display: flex; align-items: center; justify-content: center;
      text-align: center; color: var(--dim); font-size: 12px; transition: all .12s;
    }
    #cl-drop.over   { border-color: var(--purple); background: #1f0d3a40; color: var(--purple); }
    #cl-drop.hidden { display: none; }
    #cl-agents      { display: flex; flex-wrap: wrap; gap: 6px; }
    .cl-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 8px; background: var(--green-bg); border: 1px solid var(--green);
      border-radius: 6px; font-size: 11px; color: var(--green);
    }
    .cl-chip button { color: var(--green); opacity: .6; font-size: 13px; line-height: 1; }
    .cl-chip button:hover { opacity: 1; }
    #cl-name-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
    #cl-name {
      flex: 1; height: 28px; padding: 0 8px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font: inherit; outline: none; font-size: 12px;
    }
    #cl-name:focus { border-color: var(--accent); }
    #cl-json {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      padding: 10px; font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 11px; color: var(--dim); max-height: 180px; overflow-y: auto;
      white-space: pre; display: none;
    }
    #cl-json.visible { display: block; }
    .cl-actions { display: flex; gap: 6px; }

    /* ── Detail panel ────────────────────────────────────────── */
    .d-placeholder { padding: 60px 20px; text-align: center; color: var(--dim); }
    .d-placeholder .icon { font-size: 36px; margin-bottom: 10px; }
    .d-inner { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .d-name  { font-size: 15px; font-weight: 700; line-height: 1.3; }
    .d-sub   { font-size: 12px; color: var(--dim); margin-top: 3px; }
    .d-badges { display: flex; flex-wrap: wrap; gap: 5px; }
    .sec-title {
      font-size: 10px; font-weight: 700; color: var(--dim);
      text-transform: uppercase; letter-spacing: .6px; margin-bottom: 7px;
    }
    .meta-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; }
    .mk { color: var(--dim); white-space: nowrap; }
    .mv { color: var(--text); }
    .tool-item { background: var(--surface2); border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; }
    .tool-item:last-child { margin-bottom: 0; }
    .t-name { font-weight: 600; font-size: 12px; color: var(--accent); }
    .t-desc { font-size: 11px; color: var(--dim); margin-top: 2px; }
    .t-props { font-size: 11px; color: var(--dim); margin-top: 5px; padding-left: 12px; }
    .t-props li { margin-top: 2px; }
    .docs-pre {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      padding: 10px; font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 11px; color: var(--dim); max-height: 180px;
      overflow-y: auto; white-space: pre; line-height: 1.6;
    }
    .d-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    /* ── Footer ──────────────────────────────────────────────── */
    .ftr-label { font-weight: 700; color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .6px; }
    #mem-items { display: flex; align-items: center; gap: 14px; flex: 1; }
    .mem-item  { display: flex; align-items: center; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dot-healthy   { background: var(--green); }
    .dot-offline   { background: var(--red); }
    .dot-checking  { background: var(--yellow); animation: pulse 1s infinite; }
    .dot-stateless { background: var(--faint); }
    @keyframes pulse { 50% { opacity: .35; } }
    #ftr-ts { margin-left: auto; color: var(--faint); white-space: nowrap; }

    /* ── Toast ───────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 46px; left: 50%; transform: translateX(-50%);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 16px; font-size: 12px;
      opacity: 0; pointer-events: none; z-index: 999;
      transition: opacity .2s; white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* ── Scrollbar ───────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────── -->
<header id="hdr">
  <div class="logo">⚡ HyperAgent Studio <em id="v-badge"></em></div>
  <input id="search" type="search" placeholder="/ Search agents, tags, authors…" autocomplete="off">
  <div class="hdr-right">
    <span id="stats"></span>
    <button class="btn" id="btn-cluster" title="Open cluster builder">🔗 Cluster</button>
    <button class="btn" id="btn-refresh" title="Refresh">⟳ Refresh</button>
  </div>
</header>

<!-- ── Body ───────────────────────────────────────────────── -->
<div id="layout">

  <!-- Sidebar -->
  <aside id="sidebar">
    <div><div class="f-title">Runtime</div><div class="chips" id="f-runtime"></div></div>
    <div><div class="f-title">Memory</div><div class="chips" id="f-memory"></div></div>
    <div><div class="f-title">Badges</div><div class="chips" id="f-badges"></div></div>
    <div>
      <div class="f-title">Level</div>
      <select class="fsel" id="f-level">
        <option value="">All levels</option>
        <option value="1">L1+ HyperNewbie</option>
        <option value="2">L2+ Vibe Coder</option>
        <option value="3">L3+ Agent Builder</option>
        <option value="4">L4+ HyperCoder</option>
        <option value="5">L5 BROski Elite</option>
      </select>
    </div>
    <div><div class="f-title">Tags</div><div class="chips" id="f-tags"></div></div>
    <button id="btn-clear-f">✕ Clear filters</button>
  </aside>

  <!-- Main -->
  <main id="main">
    <div id="grid"></div>
    <div id="empty"><div class="icon">🔍</div><div>No agents match your filters</div></div>

    <!-- Cluster builder -->
    <div id="cluster-panel">
      <div id="cluster-hdr">
        <span>🔗</span>
        <span class="cl-title">Cluster Builder</span>
        <span class="cl-count" id="cl-count">0</span>
        <span id="cl-arrow">›</span>
      </div>
      <div id="cluster-body">
        <div id="cl-drop">Drag agent cards here, or click ⊕ on any card to add it</div>
        <div id="cl-agents"></div>
        <div id="cl-name-row"><span>Name:</span><input id="cl-name" value="my-cluster" placeholder="my-cluster"></div>
        <div id="cl-json"></div>
        <div class="cl-actions">
          <button class="btn" id="btn-copy-cl">Copy JSON</button>
          <button class="btn btn-green" id="btn-dl-cl">⬇ Download cluster.json</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Detail -->
  <aside id="detail">
    <div class="d-placeholder"><div class="icon">←</div><div>Click an agent to see details &amp; docs</div></div>
  </aside>
</div>

<!-- ── Footer ─────────────────────────────────────────────── -->
<footer id="ftr">
  <span class="ftr-label">Memory</span>
  <div id="mem-items"><span class="mem-item"><span class="dot dot-checking"></span><span style="color:var(--yellow)">Checking…</span></span></div>
  <span id="ftr-ts"></span>
  <button class="btn" id="btn-mem-refresh" style="height:24px;padding:0 8px;font-size:11px">↺</button>
</footer>

<div id="toast"></div>

<script>
// ── Badge registry ────────────────────────────────────────────────────────────
const BADGE_DEF = {
  'verified':       { icon: '✅', label: 'Verified',       c: '#3fb950', bg: '#0d2618' },
  'mcp-ready':      { icon: '⚡', label: 'MCP Ready',      c: '#58a6ff', bg: '#031d3d' },
  'memory-enabled': { icon: '🧠', label: 'Memory',         c: '#bc8cff', bg: '#1f0d3a' },
  'multi-tool':     { icon: '🔧', label: 'Multi-Tool',     c: '#f0883e', bg: '#2d1400' },
  'elite':          { icon: '👑', label: 'Elite',          c: '#e3b341', bg: '#2d2000' },
  'hyper-coder':    { icon: '🚀', label: 'HyperCoder',     c: '#58a6ff', bg: '#031d3d' },
  'env-declared':   { icon: '🔐', label: 'Env Declared',   c: '#d29922', bg: '#2d1a00' },
  'health-checked': { icon: '💚', label: 'Health Checked', c: '#3fb950', bg: '#0d2618' },
};
const LEVELS = { 1:'HyperNewbie', 2:'Vibe Coder', 3:'Agent Builder', 4:'HyperCoder', 5:'BROski Elite' };

// ── State ─────────────────────────────────────────────────────────────────────
const S = {
  reg:      null,
  mem:      null,
  sel:      null,
  cluster:  [],
  filters:  { search:'', runtime:null, memory:null, badge:null, level:null, tags:[] },
};

// ── Helpers ───────────────────────────────────────────────────────────────────
const esc  = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const $    = id => document.getElementById(id);
const toast = (msg, ok = true) => {
  const el = $('toast');
  el.textContent = msg;
  el.style.color = ok ? 'var(--green)' : 'var(--red)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
};

function badgeHtml(id) {
  const b = BADGE_DEF[id] || { icon: '·', label: id, c: '#8b949e', bg: '#1c2128' };
  return `<span class="badge" style="color:${b.c};background:${b.bg}" title="${b.label}">${b.icon} ${esc(b.label)}</span>`;
}

function rtClass(rt) {
  return rt === 'node' ? 'cp-node' : rt === 'python' ? 'cp-python' : 'cp-deno';
}

// ── API ───────────────────────────────────────────────────────────────────────
async function loadRegistry() {
  try {
    const r = await fetch('/api/registry');
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      $('grid').innerHTML = `<div style="color:var(--red);padding:20px;grid-column:1/-1">
        ⚠ ${esc(e.error || 'Registry not found')}<br><br>
        <code>hyper-agent registry build &lt;agents-dir&gt;</code>
      </div>`;
      return;
    }
    S.reg = await r.json();
    $('v-badge').textContent = `v${S.reg.spec_version || '1'}`;
    renderAll();
    toast(`${S.reg.agent_count} agent${S.reg.agent_count !== 1 ? 's' : ''} loaded ✓`);
  } catch (e) {
    $('grid').innerHTML = `<div style="color:var(--red);padding:20px;grid-column:1/-1">⚠ Cannot reach server: ${esc(e.message)}</div>`;
  }
}

async function loadMemory() {
  $('mem-items').innerHTML = '<span class="mem-item"><span class="dot dot-checking"></span><span style="color:var(--yellow)">Checking…</span></span>';
  try {
    const r = await fetch('/api/memory');
    S.mem = await r.json();
    renderMemFooter();
    if (S.sel) renderDetail(S.sel); // refresh memory dots in detail
  } catch {
    $('mem-items').innerHTML = '<span style="color:var(--red)">✗ Check failed</span>';
  }
}

// ── Filter ────────────────────────────────────────────────────────────────────
function matches(a) {
  const f = S.filters;
  if (f.search) {
    const q = f.search.toLowerCase();
    const haystack = [a.name, a.display_name, a.description, a.author, ...(a.tags||[])].map(v => (v||'').toLowerCase());
    if (!haystack.some(h => h.includes(q))) return false;
  }
  if (f.runtime && a.runtime !== f.runtime) return false;
  if (f.memory  && a.memory  !== f.memory)  return false;
  if (f.badge   && !a.badges.includes(f.badge)) return false;
  if (f.level   && (a.course_level||0) < parseInt(f.level)) return false;
  if (f.tags.length && !f.tags.every(t => (a.tags||[]).includes(t))) return false;
  return true;
}

// ── Render: all ───────────────────────────────────────────────────────────────
function renderAll() {
  if (!S.reg) return;
  const agents   = S.reg.agents || [];
  const filtered = agents.filter(matches);

  $('grid').innerHTML   = filtered.map(cardHtml).join('');
  $('empty').style.display = filtered.length ? 'none' : 'block';
  $('stats').textContent   = `${filtered.length} / ${agents.length} agent${agents.length !== 1 ? 's' : ''}`;

  buildSidebar(agents);
}

// ── Render: sidebar ───────────────────────────────────────────────────────────
function buildSidebar(agents) {
  const f = S.filters;

  const rts = [...new Set(agents.map(a => a.runtime))].sort();
  $('f-runtime').innerHTML = rts.map(r =>
    `<span class="chip chip-${r}${f.runtime===r?' on':''}" onclick="toggleF('runtime','${r}')">${r}</span>`
  ).join('');

  const mems = [...new Set(agents.map(a => a.memory))].sort();
  $('f-memory').innerHTML = mems.map(m =>
    `<span class="chip${f.memory===m?' on':''}" onclick="toggleF('memory','${m}')">${m}</span>`
  ).join('');

  const bcounts = {};
  agents.forEach(a => a.badges.forEach(b => bcounts[b] = (bcounts[b]||0)+1));
  const topB = Object.entries(bcounts).sort((a,b)=>b[1]-a[1]).slice(0,8).map(e=>e[0]);
  $('f-badges').innerHTML = topB.map(b => {
    const d = BADGE_DEF[b];
    if (!d) return '';
    const active = f.badge === b;
    return `<span class="chip${active?' on':''}"
      style="${active?'':`color:${d.c}`}"
      onclick="toggleF('badge','${b}')">${d.icon} ${d.label}</span>`;
  }).join('');

  const allTags = [...new Set(agents.flatMap(a => a.tags||[]))].sort();
  $('f-tags').innerHTML = allTags.map(t =>
    `<span class="chip${f.tags.includes(t)?' on':''}" onclick="toggleTag('${t}')">${esc(t)}</span>`
  ).join('');
}

function toggleF(key, val) {
  S.filters[key] = S.filters[key] === val ? null : val;
  renderAll();
}
function toggleTag(t) {
  const i = S.filters.tags.indexOf(t);
  i >= 0 ? S.filters.tags.splice(i,1) : S.filters.tags.push(t);
  renderAll();
}

// ── Render: card ─────────────────────────────────────────────────────────────
function cardHtml(a) {
  const inCl  = S.cluster.some(c => c.name === a.name);
  const isSel = S.sel?.name === a.name;
  const mcpCp = a.mcp_compatible ? `<span class="cp cp-mcp" title="MCP">⚡ :${a.port}</span>` : '';
  const memCp = a.memory !== 'none' ? `<span class="cp cp-mem">${a.memory==='redis'?'🔴':'🐘'} ${esc(a.memory)}</span>` : '';
  const lvlCp = a.course_level ? `<span class="cp cp-dim">L${a.course_level}</span>` : '';
  const bgs   = a.badges.length ? `<div class="card-badges">${a.badges.map(badgeHtml).join('')}</div>` : '';

  return `<div class="card${isSel?' sel':''}${inCl?' clustered':''}"
      draggable="true"
      data-name="${esc(a.name)}"
      onclick="selectAgent('${a.name}')"
      ondragstart="onDragStart(event,'${a.name}')">
    <div class="card-top">
      <div>
        <div class="card-name">${esc(a.display_name||a.name)}</div>
        <div class="card-sub">${esc(a.name)} · v${esc(a.version)}</div>
      </div>
      <button class="btn-c${inCl?' on':''}"
              onclick="event.stopPropagation();toggleCluster('${a.name}')"
              title="${inCl?'Remove from cluster':'Add to cluster'}">
        ${inCl ? '✓' : '+'}
      </button>
    </div>
    <div class="card-desc">${esc(a.description||'No description')}</div>
    <div class="card-meta">
      <span class="cp ${rtClass(a.runtime)}">${esc(a.runtime)}</span>
      ${mcpCp}${memCp}${lvlCp}
    </div>
    ${bgs}
  </div>`;
}

// ── Agent selection + detail ──────────────────────────────────────────────────
function selectAgent(name) {
  S.sel = (S.reg?.agents||[]).find(a => a.name === name) || null;
  renderAll();
  if (S.sel) renderDetail(S.sel);
}

function memDot(name) {
  if (!S.mem?.results) return '';
  const r = S.mem.results.find(r => r.name === name);
  if (!r || r.status === 'stateless') return '';
  const c = r.status === 'healthy' ? 'var(--green)' : 'var(--red)';
  return ` <span style="color:${c}">●</span>`;
}

function renderDetail(a) {
  const mcp = a.mcp_compatible ? `✓ port ${a.port}` : '✗';
  const lvl = a.course_level  ? `L${a.course_level} — ${LEVELS[a.course_level]||''}` : '—';
  const inCl = S.cluster.some(c => c.name === a.name);

  const toolsHtml = (a.tools||[]).map(t => {
    const props = Object.entries(t.input_schema?.properties||{}).map(([k,v]) =>
      `<li><code>${esc(k)}</code> <span style="color:var(--faint)">${esc(v.type||'any')}</span>${v.description?` — ${esc(v.description)}`:''}</li>`
    ).join('');
    const req = (t.input_schema?.required||[]).join(', ');
    return `<div class="tool-item">
      <div class="t-name">${esc(t.name)}</div>
      <div class="t-desc">${esc(t.description)}</div>
      ${props ? `<ul class="t-props">${props}</ul>` : ''}
      ${req    ? `<div class="t-props" style="padding-left:0;list-style:none;margin-top:3px">Required: <code>${esc(req)}</code></div>` : ''}
    </div>`;
  }).join('');

  const evars = a.env_vars?.length
    ? a.env_vars.map(v=>`<code>${esc(v)}</code>`).join(' ')
    : '<span style="color:var(--faint)">none</span>';

  $('detail').innerHTML = `<div class="d-inner">
    <div>
      <div class="d-name">${esc(a.display_name||a.name)}</div>
      <div class="d-sub">${esc(a.name)} · v${esc(a.version)} · by ${esc(a.author||'unknown')}</div>
    </div>
    ${a.badges.length ? `<div class="d-badges">${a.badges.map(badgeHtml).join('')}</div>` : ''}
    <div>
      <div class="sec-title">Metadata</div>
      <div class="meta-grid">
        <span class="mk">Runtime</span>  <span class="mv">${esc(a.runtime)}</span>
        <span class="mk">Level</span>    <span class="mv">${esc(lvl)}</span>
        <span class="mk">Memory</span>   <span class="mv">${esc(a.memory)}${memDot(a.name)}</span>
        <span class="mk">MCP</span>      <span class="mv">${esc(mcp)}</span>
        ${a.health_check ? `<span class="mk">Health</span><span class="mv"><code>${esc(a.health_check)}</code></span>` : ''}
        <span class="mk">Env vars</span> <span class="mv">${evars}</span>
        ${a.tags?.length ? `<span class="mk">Tags</span><span class="mv">${esc(a.tags.join(', '))}</span>` : ''}
      </div>
    </div>
    ${toolsHtml ? `<div><div class="sec-title">Tools (${(a.tools||[]).length})</div>${toolsHtml}</div>` : ''}
    <div>
      <div class="sec-title">Auto-generated Docs</div>
      <pre class="docs-pre" id="docs-out">${esc(makeDocs(a))}</pre>
    </div>
    <div class="d-actions">
      <button class="btn" onclick="copyText(makeDocs(findAgent('${a.name}')))">Copy docs</button>
      <button class="btn" onclick="copyText('${esc(a.manifest_path)}')">Copy path</button>
      <button class="btn${inCl?' btn-green':''}" onclick="toggleCluster('${a.name}')">
        ${inCl ? '✓ In cluster' : '⊕ Add to cluster'}
      </button>
    </div>
  </div>`;
}

function findAgent(name) { return (S.reg?.agents||[]).find(a=>a.name===name)||{}; }

function makeDocs(a) {
  if (!a || !a.name) return '';
  const badgeStr = a.badges.map(b=>BADGE_DEF[b]?.label||b).join(' · ');
  const mcp      = a.mcp_compatible ? `✓ (port ${a.port})` : '✗';
  const tools    = (a.tools||[]).map(t=>`- \`${t.name}\`: ${t.description}`).join('\n');
  return `## ${a.display_name||a.name} v${a.version}

Runtime: ${a.runtime} | Level: ${a.course_level?`L${a.course_level} ${LEVELS[a.course_level]}`:'—'} | MCP: ${mcp}
Memory: ${a.memory} | Author: ${a.author||'unknown'}
${badgeStr?`Badges: ${badgeStr}`:''}

${a.description||''}

### Tools
${tools||'(none)'}

### Manifest
\`${a.manifest_path}\``;
}

// ── Cluster ───────────────────────────────────────────────────────────────────
function toggleCluster(name) {
  const agent = (S.reg?.agents||[]).find(a=>a.name===name);
  if (!agent) return;
  const i = S.cluster.findIndex(a=>a.name===name);
  i >= 0 ? S.cluster.splice(i,1) : S.cluster.push(agent);
  renderAll();
  if (S.sel?.name === name) renderDetail(S.sel);
  renderCluster();
  // Auto-open cluster panel when first agent added
  if (S.cluster.length === 1) openClusterBody(true);
}

function renderCluster() {
  const n   = S.cluster.length;
  const cnt = $('cl-count');
  cnt.textContent = n;
  cnt.className   = n ? 'cl-count has' : 'cl-count';

  const drop = $('cl-drop');
  const ags  = $('cl-agents');
  const json = $('cl-json');

  if (!n) {
    drop.className = '';
    ags.innerHTML  = '';
    json.className = '';
    json.textContent = '';
    return;
  }

  drop.className = 'hidden';
  ags.innerHTML  = S.cluster.map(a =>
    `<span class="cl-chip">
       ${a.runtime==='node'?'⬡':'🐍'} ${esc(a.name)}
       <button onclick="toggleCluster('${a.name}')" title="Remove">✕</button>
     </span>`
  ).join('');

  json.className   = 'visible';
  json.textContent = makeClusterJSON();
}

function makeClusterJSON() {
  const name    = $('cl-name')?.value || 'my-cluster';
  const portMap = {};
  const memSet  = new Set();
  S.cluster.forEach(a => {
    if (a.port) portMap[a.port] = a.name;
    if (a.memory !== 'none') memSet.add(a.memory);
  });
  return JSON.stringify({
    name,
    spec_version:  '1.0.0',
    created_at:    new Date().toISOString(),
    agents: S.cluster.map(a => ({
      name:           a.name,
      version:        a.version,
      runtime:        a.runtime,
      manifest_path:  a.manifest_path,
      mcp_compatible: a.mcp_compatible,
      port:           a.port  || null,
      memory:         a.memory,
    })),
    ...(Object.keys(portMap).length ? { port_map:        portMap }       : {}),
    ...(memSet.size                 ? { memory_backends: [...memSet] }   : {}),
  }, null, 2);
}

function openClusterBody(open) {
  const body  = $('cluster-body');
  const arrow = $('cl-arrow');
  const hdr   = $('cluster-hdr');
  if (open) {
    body.className  = 'open';
    arrow.className = 'open';
    hdr.className   = 'open';
  } else {
    body.className  = '';
    arrow.className = '';
    hdr.className   = '';
  }
}

// ── Drag and drop ─────────────────────────────────────────────────────────────
function onDragStart(e, name) {
  e.dataTransfer.setData('agentName', name);
  e.dataTransfer.effectAllowed = 'copy';
}

// ── Memory footer ─────────────────────────────────────────────────────────────
function renderMemFooter() {
  if (!S.mem?.results) return;
  const dedup = {};
  S.mem.results.forEach(r => {
    if (r.status === 'stateless') return;
    const k = `${r.memory}:${r.host}:${r.port}`;
    if (!dedup[k]) dedup[k] = { ...r };
    if (r.status === 'offline') dedup[k].status = 'offline';
  });

  const items = Object.values(dedup);
  const el    = $('mem-items');

  if (!items.length) {
    el.innerHTML = '<span style="color:var(--faint)">All agents stateless</span>';
  } else {
    el.innerHTML = items.map(b => {
      const label = b.memory === 'redis' ? '🔴 Redis' : '🐘 Postgres';
      const col   = b.status === 'healthy' ? 'var(--green)' : 'var(--red)';
      return `<span class="mem-item">
        <span class="dot dot-${b.status}"></span>
        <span style="color:${col}">${label} — ${b.status}</span>
        <span style="color:var(--faint);font-size:10px">${b.host}:${b.port}</span>
      </span>`;
    }).join('');
  }

  const ts = new Date(S.mem.checked_at).toLocaleTimeString();
  $('ftr-ts').textContent = `Checked: ${ts}`;
}

// ── Copy / download ───────────────────────────────────────────────────────────
function copyText(text) {
  navigator.clipboard.writeText(text)
    .then(()  => toast('Copied to clipboard!'))
    .catch(()  => toast('Copy failed', false));
}
function downloadJSON(filename, text) {
  const a = document.createElement('a');
  a.href     = 'data:application/json,' + encodeURIComponent(text);
  a.download = filename;
  a.click();
}

// ── Event wiring ──────────────────────────────────────────────────────────────
$('search').addEventListener('input', e => { S.filters.search = e.target.value; renderAll(); });
$('f-level').addEventListener('change', e => { S.filters.level = e.target.value||null; renderAll(); });

$('btn-clear-f').addEventListener('click', () => {
  S.filters = { search:'', runtime:null, memory:null, badge:null, level:null, tags:[] };
  $('search').value = '';
  $('f-level').value = '';
  renderAll();
});

$('btn-refresh').addEventListener('click', () => { loadRegistry(); loadMemory(); });
$('btn-mem-refresh').addEventListener('click', loadMemory);

$('btn-cluster').addEventListener('click', () => {
  openClusterBody(true);
  $('cluster-panel').scrollIntoView({ behavior:'smooth', block:'start' });
});

$('cluster-hdr').addEventListener('click', () => {
  const isOpen = $('cluster-body').className === 'open';
  openClusterBody(!isOpen);
  renderCluster();
});

// Drop zone
const drop = $('cl-drop');
drop.addEventListener('dragover',  e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('over');
  const name = e.dataTransfer.getData('agentName');
  if (name && !S.cluster.some(a=>a.name===name)) toggleCluster(name);
});

$('cl-name').addEventListener('input', () => {
  const json = $('cl-json');
  if (json.className === 'visible') json.textContent = makeClusterJSON();
});
$('btn-copy-cl').addEventListener('click', () => copyText(makeClusterJSON()));
$('btn-dl-cl').addEventListener('click', () => {
  const name = $('cl-name').value || 'my-cluster';
  downloadJSON(`${name}.json`, makeClusterJSON());
  toast(`${name}.json downloaded!`);
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    $('search').focus();
  }
  if (e.key === 'Escape') {
    $('search').blur();
    S.sel = null;
    $('detail').innerHTML = '<div class="d-placeholder"><div class="icon">←</div><div>Click an agent to see details &amp; docs</div></div>';
    renderAll();
  }
});

// Auto-refresh memory every 30s
setInterval(loadMemory, 30_000);

// ── Init ──────────────────────────────────────────────────────────────────────
loadRegistry();
loadMemory();
</script>
</body>
</html>
